<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Article — DEVZOOP Blog</title>
    <meta name="description" content="Developer journal by Rahul Mandal — a note from the build." />
    <meta name="author" content="Rahul Mandal" />

    <meta property="og:type" content="article" />
    <meta property="og:site_name" content="DEVZOOP" />
    <meta property="og:title" content="Article — DEVZOOP Blog" />
    <meta property="og:description" content="Developer journal by Rahul Mandal — a note from the build." />

    <!-- Shared site styles -->
    <link rel="stylesheet" href="../assets/css/style.css?v=2" />
    <link href="../assets/remixIcon/fonts/remixicon.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Blog-specific styles -->
    <link rel="stylesheet" href="blog.css?v=1" />
</head>

<body>

    <!-- Progress Bar -->
    <div class="progress-container" aria-hidden="true">
        <div class="progress-bar" id="myProgressBar"></div>
    </div>

    <!-- Navigation -->
    <header id="site-header">
        <div class="header-inner">
            <a href="../" class="logo" aria-label="DEVZOOP Home">
                <span class="logo-text">DEV<span class="logo-accent">ZOOP</span></span>
                <span class="logo-dot"></span>
            </a>
            <nav id="main-nav" aria-label="Main navigation">
                <ul class="nav-links">
                    <li><a href="../#work" class="nav-link">Work</a></li>
                    <li><a href="../#about" class="nav-link">About</a></li>
                    <li><a href="./" class="nav-link active">Blog</a></li>
                    <li><a href="../#contact" class="nav-link">Contact</a></li>
                </ul>
                <a href="https://github.com/developer-rahul-mandal" target="_blank" rel="noopener noreferrer" class="nav-github" aria-label="GitHub Profile">
                    <i class="ri-github-fill"></i>
                    <span>GitHub</span>
                    <i class="ri-arrow-right-up-line"></i>
                </a>
            </nav>
            <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation" aria-expanded="false">
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
            </button>
        </div>
    </header>

    <main>

        <!-- Article Content — rendered by JS -->
        <article class="article-page section" id="article-page">
            <div class="article-loading">
                <p>Loading article...</p>
            </div>
        </article>

        <!-- Back to Blog -->
        <div class="article-back section" id="article-back" style="display:none;">
            <a href="./" class="btn btn-outline">
                <i class="ri-arrow-left-line"></i>
                <span>Back to All Notes</span>
            </a>
        </div>

        <!-- Article Not Found -->
        <section class="blog-empty section" id="article-not-found" style="display:none;">
            <div class="empty-state">
                <div class="empty-icon" aria-hidden="true">
                    <i class="ri-file-unknow-line"></i>
                </div>
                <h3 class="empty-title">Article not found</h3>
                <p class="empty-description">This article doesn't exist or has been moved.</p>
                <a href="./" class="btn btn-outline">
                    <i class="ri-arrow-left-line"></i>
                    <span>Back to Blog</span>
                </a>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer id="site-footer">
        <div class="footer-top">
            <div class="footer-brand">
                <span class="logo-text">DEV<span class="logo-accent">ZOOP</span></span>
                <p class="footer-tagline">Building useful things for the web.</p>
            </div>
            <nav class="footer-nav" aria-label="Footer navigation">
                <a href="../#work">Work</a>
                <a href="../#about">About</a>
                <a href="./">Blog</a>
                <a href="../#contact">Contact</a>
            </nav>
            <div class="footer-socials">
                <a href="https://github.com/developer-rahul-mandal" target="_blank" rel="noopener noreferrer" aria-label="GitHub"><i class="ri-github-fill"></i></a>
                <a href="#" aria-label="LinkedIn"><i class="ri-linkedin-box-fill"></i></a>
                <a href="#" aria-label="Reddit"><i class="ri-reddit-line"></i></a>
                <a href="#" aria-label="X"><i class="ri-twitter-x-line"></i></a>
            </div>
        </div>
        <div class="footer-bottom">
            <p class="footer-copy">DEVZOOP &copy; <span id="footer-year"></span></p>
            <button class="back-to-top" id="backToTop" aria-label="Back to top">
                <i class="ri-arrow-up-line"></i>
                <span>Top</span>
            </button>
            <p class="footer-signoff">Built with code &amp; coffee. <i class="ri-cup-fill"></i></p>
        </div>
    </footer>

    <script src="blog-data.js?v=1"></script>
    <script src="blog.js?v=1"></script>
</body>

</html>
